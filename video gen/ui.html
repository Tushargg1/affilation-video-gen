<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digen AI Automation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            max-width: 500px;
            margin: 40px auto;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #18181b;
            color: #f4f4f5;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fafafa;
        }

        .tag {
            font-size: 11px;
            background: #8b5cf6;
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }

        .preset-btn {
            padding: 10px 12px;
            background: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            text-align: left;
            font-size: 13px;
            color: #e4e4e7;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .preset-btn:hover {
            background: #3f3f46;
            border-color: #8b5cf6;
            color: #fff;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 20px;
            background: #09090b;
            color: #fafafa;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        button.btn-primary {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button.btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        button.btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        button.btn-secondary {
            padding: 12px 16px;
            background: #27272a;
            color: #a1a1aa;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        button.btn-secondary:hover {
            background: #3f3f46;
            color: #fff;
        }

        .status {
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            font-weight: 500;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid #059669;
            display: block;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid #dc2626;
            display: block;
        }

        .status.info {
            background: rgba(139, 92, 246, 0.15);
            color: #c084fc;
            border: 1px solid #7c3aed;
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎬 Digen AI Local Automation</h1>
        <span class="tag">Server Active</span>
    </div>

    <div id="status" class="status"></div>

    <label>Quick Presets</label>
    <div class="preset-grid">
        <button class="preset-btn" data-prompt="A colorful toy car racing on a miniature track, smooth camera movement following the car, cinematic lighting, high quality 4K, detailed close-up shots">
            🚗 Toy Car
        </button>
        <button class="preset-btn" data-prompt="A miniature toy train moving through a detailed model railway landscape, realistic scenery, 4K quality, smooth motion">
            🚂 Toy Train
        </button>
        <button class="preset-btn" data-prompt="A cute robot toy walking and dancing, colorful LED lights, smooth animation, playful movements, 4K quality">
            🤖 Dancing Robot
        </button>
        <button class="preset-btn" data-prompt="A cute fluffy orange kitten playing on a wooden table, high detail, 4k cinematic lighting, ultra realistic motion">
            🐱 Playful Cat
        </button>
    </div>

    <label for="prompt">Prompt Text</label>
    <textarea id="prompt" placeholder="Enter your video prompt...">A colorful toy car racing on a miniature track, smooth camera movement following the car, cinematic lighting, high quality 4K, detailed close-up shots</textarea>

    <div class="button-group">
        <button id="generateBtn" class="btn-primary">
            <span>⚡</span> Generate Video
        </button>
        <button id="resetBtn" class="btn-secondary" title="Reset to Toy Car">↻</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const generateBtn = document.getElementById('generateBtn');
            const resetBtn = document.getElementById('resetBtn');
            const promptTextarea = document.getElementById('prompt');
            const statusDiv = document.getElementById('status');
            const presetButtons = document.querySelectorAll('.preset-btn');

            const defaultPrompt = 'A colorful toy car racing on a miniature track, smooth camera movement following the car, cinematic lighting, high quality 4K, detailed close-up shots';

            presetButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    promptTextarea.value = btn.dataset.prompt;
                    showStatus('Preset loaded!', 'info');
                });
            });

            resetBtn.addEventListener('click', () => {
                promptTextarea.value = defaultPrompt;
            });

            generateBtn.addEventListener('click', async () => {
                const prompt = promptTextarea.value.trim();
                if (!prompt) {
                    showStatus('Enter a prompt first', 'error');
                    return;
                }

                generateBtn.disabled = true;
                generateBtn.innerHTML = '<span>⏳</span> Automating Mouse...';
                showStatus('Opening Edge and automating mouse...', 'info');

                try {
                    const response = await fetch('/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt })
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        showStatus('✓ Automation successful! Video is generating.', 'success');
                    } else {
                        showStatus('Error: ' + data.error, 'error');
                    }
                } catch (err) {
                    showStatus('Server Error: ' + err.message, 'error');
                } finally {
                    generateBtn.disabled = false;
                    generateBtn.innerHTML = '<span>⚡</span> Generate Video';
                }
            });

            function showStatus(msg, type) {
                statusDiv.textContent = msg;
                statusDiv.className = 'status ' + type;
                if (type === 'success' || type === 'info') {
                    setTimeout(() => { statusDiv.className = 'status'; }, 5000);
                }
            }
        });
    </script>
</body>
</html>
